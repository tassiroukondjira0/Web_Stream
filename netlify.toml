# Deployment Netlify - Stream_Web (CinemaMax)
# ==========================================
# Build command : npx prisma generate && npx prisma db push && next build
# Install command : npm ci
# Publish       : .next/standalone
#
# ENV VARIABLES (Site -> Settings -> Environment Variables) :
#   DATABASE_URL       -> PostgreSQL pooled URL (Neon, Supabase, Railway...)
#   DATABASE_READY     -> "true"
#   NEXTAUTH_SECRET    -> openssl rand -base64 32
#   TMDB_API_TOKEN     -> TMDB (v4) token
#   NEXT_PUBLIC_APP_NAME / NEXT_PUBLIC_APP_URL -> public
#
# Add prisma db push to the build to create tables on each deploy.
# ============================================================================
[build]
  command = "npx prisma generate && npx prisma db push && next build"
  environment = { NODE_ENV = "production" }
  publish = ".next/standalone"

[dev]
  port = 3000
  environment = { NODE_ENV = "development" }

[[redirects]]
  from = "/*"
  to = "/.netlify/functions-internal/___netlify-server-handler"
  status = 200

